# Proofseen on the shared VPS. It joins the network of the existing Caddy (DEMOMEA stack), which terminates TLS for
# proofseen.com and proxies to this container; no port is published on the host.
services:
  web:
    build:
      context: ../..
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    image: proofseen-web
    container_name: proofseen-web
    env_file: ../../.env.production
    environment:
      PROOFSEEN_UPLOADS_DIR: /data/uploads
    # Uploaded files (profile photos, portfolio images, CVs) live in a named volume: they survive a rebuild of the
    # image and a restart of the container. Back it up with the database.
    volumes:
      - proofseen-uploads:/data/uploads
    restart: unless-stopped
    networks: [demoema_web]

volumes:
  proofseen-uploads:

networks:
  demoema_web:
    external: true
