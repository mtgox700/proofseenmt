signature:
  level: simple
  order: parallel
  signatories:
    - { role: seller, rule: "le freelance titulaire du profil du contrat (contracts.ts, sign())" }
    - { role: buyer, rule: "un propriétaire ou administrateur de l'organisation du contrat (contracts.ts, sign())" }

retention:
  active: until_contract_end
  archive: { years: 5, from: contract_end, sources: [civ-2224, com-l110-4] }
  accounting: { years: 10, from: fiscal_year_end, sources: [com-l123-22], status: HYPOTHESIS }
  onPartyErasure: archive
  draftsOnPartyErasure: delete

review:
  status: draft
  reviewedBy: null
  reviewedOn: null
  reviewedDigest: null
  points:
    - id: R1
      clause: platform-role
      question: "Le rôle de Proofseen (intermédiaire non partie, mandataire de facturation du Prestataire, outil de paiement opéré par Stripe) est-il décrit sans faire de Proofseen un mandataire de paiement au sens du Code monétaire et financier, ni un employeur ? Nom exact de l'entité Stripe à citer (Stripe Technology Europe Ltd selon la recherche L0 §6, source Stripe) : à confirmer."
    - id: R2
      clause: contract-documents
      question: "Le contrat est rédigé à l'avance par Proofseen, tiers aux deux parties. Est-ce un contrat d'adhésion au sens de l'article 1110 (clauses déterminées à l'avance par l'une des parties) ? Conséquences sur 1171 (déséquilibre significatif) et 1190 (interprétation)."
    - id: R3
      clause: payment
      question: "Paiement exigé avant le début de la prestation, avant toute facture : qualification d'acompte et exigibilité de la TVA du Prestataire (question K5 à Bertrand, L0-010) ; rédaction des pénalités de retard dans un paiement d'avance."
    - id: R4
      clause: acceptance
      question: "Recette réputée prononcée à défaut de réserves motivées dans le délai (au plus 30 jours, L441-10 III) : validité de l'acceptation tacite stipulée (1120) et articulation avec la règle actuelle du code (aucun versement automatique, revue humaine, validation-reminders.ts)."
    - id: R5
      clause: refunds
      question: "Engagement du Client d'utiliser la procédure de réserves avant toute contestation de paiement auprès de sa banque ; reprise du virement sur le compte de versement du Prestataire. Validité entre professionnels, et renvoi aux CGU (L5)."
    - id: R6
      clause: invoicing
      question: "Mandat de facturation : le texte accepté aujourd'hui tient en une phrase (apps/web/src/i18n/market/billing-fr.ts). Délai de contestation de chaque facture, responsabilité conservée par le Prestataire, information de l'administration : à prévoir dans le mandat signé (L2.6). Le mandat actuel vise « mes factures de mission » et ne couvre ni les factures rectificatives ni les avoirs (L1-045, Bertrand) : l'article « Réductions, remboursements » suppose un mandat qui les couvre. Mandataire nommé : la société e-kigai (le contrat définit désormais « Proofseen » comme cette société, L1-045)."
    - id: R7
      clause: intellectual-property
      question: "Cession : mentions distinctes et domaine (L131-3) ; prix de cession compris dans le prix forfaitaire, admis pour le logiciel (L131-4) mais à justifier pour les autres oeuvres (documents, graphismes) ; transfert à la recette et au paiement complet ; éléments préexistants et logiciels libres exclus."
    - id: R8
      clause: independence
      question: "La clause d'indépendance suffit-elle face à un faisceau d'indices de subordination dans l'exécution réelle (L8221-6 II) ? Faut-il ajouter une obligation du Client de ne pas intégrer le Prestataire à son organisation hiérarchique ?"
    - id: R9
      clause: confidentiality
      question: "Durée de confidentialité finie (5 ans par défaut) au regard de 1210, et articulation avec le secret des affaires (L151-1) qui peut durer plus longtemps."
    - id: R10
      clause: liability
      question: "Plafond réciproque égal au prix HT (forfait) ou aux sommes HT des douze derniers mois (régie), avec exclusions (faute lourde ou dolosive, atteinte aux personnes, confidentialité, contrefaçon). Compatible avec 1170 et 1171 ?"
    - id: R11
      clause: vigilance
      question: "Le contrôle de l'attestation par un opérateur de Proofseen sur urssaf.fr décharge-t-il le Client de la vérification d'authenticité exigée par D8222-5 ? La clause dit que non ; à confirmer."
    - id: R12
      clause: termination
      question: "Préavis de 30 jours par défaut pour une régie sans terme, à allonger avec l'ancienneté (L442-1 II) ; délai de mise en demeure de 15 jours (1225) ; sort des travaux en cours au forfait."
    - id: R13
      clause: disputes
      question: "Aucune clause attributive de compétence : l'article 48 du CPC la réserve aux parties qui ont toutes contracté en qualité de commerçant, ce que beaucoup de freelances (professions libérales) ne sont pas. Faut-il une clause conditionnelle quand les deux parties sont commerçantes ? Médiation à proposer ?"
    - id: R14
      clause: non-solicitation
      question: "Non-sollicitation réciproque limitée aux personnes ayant participé à la mission, 12 mois au plus, sans indemnité forfaitaire : proportion à valider (jurisprudence NON VÉRIFIÉE dans cette session). Aucune clause de non-concurrence ni de non-contournement de la plateforme dans ce contrat : la seconde relève des CGU (L5)."
    - id: R15
      clause: evidence
      question: "Convention de preuve sans présomption irréfragable (1356) ; portée de l'arrêt Cass. civ. 3e, 5 mars 2026, n° 24-21.034 (inédit) pour une signature simple contestée ; contenu du dossier de preuve suffisant au regard de 1366 et 287 CPC."
    - id: R16
      clause: governing-law
      question: "Client établi hors de France : choix de la loi française (règlement Rome I, NON RELU dans cette session) et version anglaise remise avec la française qui fait foi."
    - id: R17
      clause: reference
      question: "Consentement du Client à être nommé sur le profil du Prestataire comme mission vérifiée : forme suffisante dans un contrat signé, et retrait de ce consentement."
    - id: R18
      clause: invoicing
      question: "VERSION 2 DU GABARIT, à écrire avant toute émission datée du 1er janvier 2027 (non faite en v1, décision du Chancelier) : citer directement le CIBS au lieu du CGI, recommandation de Bertrand (L1-040, L1-073 point 2). Article « Facturation » : remplacer « article 289, I-2, du code général des impôts » par « article L. 216-35 du code des impositions sur les biens et services » (source cibs-l216-35, validFrom 2027-01-01) et dire que l'obligation de facturation n'est remplie que par l'acceptation de chaque facture par le Prestataire. Article « TVA », variante exempt : la mention « article 293 B du CGI » reste admise jusqu'au 30 juin 2028 (BOI-RES-TVA-000253 §3.1) ; ne passer à la franchise du CIBS (L. 233-3 et suivants) que quand le libellé officiel de la mention sera publié (NON VÉRIFIÉ aujourd'hui). Même changement dans en.yaml et dans le devis (variante exempt). La v2 garde les identifiants de clauses pour que la comparaison de versions reste exacte."
    - id: R19
      clause: payment
      question: "Pénalités stipulées à trois fois le taux d'intérêt légal : c'est le plancher de L441-10 II, valable s'il est stipulé ; la facture doit alors imprimer ce taux du contrat (L1-042 point 3, Bertrand), et non le taux BCE majoré de 10 points, qui ne vaut qu'à défaut de stipulation. À confirmer, ainsi que l'écart avec les contrats d'avant le coffre, qui n'ont aucune stipulation."
    - id: R20
      clause: evidence
      question: "Bloc de signature (moteur, src/chrome.ts) : aucun « fait à » ni lieu imprimé. Aucune exigence de lieu n'a été trouvée dans les articles 1364 à 1379 du Code civil lus le 2026-10-24, et un contrat conclu à distance est réputé conclu là où l'acceptation parvient à l'offrant (1121) : imprimer une ville serait un fait inventé. À confirmer."
